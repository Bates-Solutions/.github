name: Feature request
description: Suggest a change
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like it to do
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything else you considered
