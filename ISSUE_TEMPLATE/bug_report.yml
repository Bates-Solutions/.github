name: Bug report
description: Something doesn't work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For a security problem, don't open an issue: see [SECURITY.md](https://github.com/Bates-Solutions/.github/blob/main/SECURITY.md). Don't paste API keys, tokens or personal data.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release, package version or commit you're using.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, Node.js version or operating system, whichever applies.
